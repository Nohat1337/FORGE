name: Forge CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake git libsdl2-dev pkg-config

      - name: Configure
        run: cmake -B build-release -DCMAKE_BUILD_TYPE=Release -DFORGE_WITH_LSP=ON

      - name: Build
        run: cmake --build build-release --target forge forgevm forge-lsp forge_core -j$(nproc)

      - name: Test
        run: |
          ./build-release/forgevm examples/simple.fge || true
          ./build-release/forgevm --help | head -5

  build-macos:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: brew install sdl2 cmake

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --target forgevm forge -j$(sysctl -n hw.ncpu)

      - name: Test
        run: |
          ./build/forgevm examples/simple.fge || true

  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install SDL2 via vcpkg
        run: |
          git clone https://github.com/microsoft/vcpkg.git C:\vcpkg
          C:\vcpkg\bootstrap-vcpkg.bat
          C:\vcpkg\vcpkg install sdl2:x64-windows

      - name: Configure
        run: cmake -B build -S . -G "Visual Studio 17 2022" -A x64 -DCMAKE_TOOLCHAIN_FILE=C:/vcpkg/scripts/buildsystems/vcpkg.cmake -DCMAKE_BUILD_TYPE=Release -DFORGE_WITH_LSP=ON

      - name: Build
        run: cmake --build build --config Release --target forgevm forge forge-lsp --parallel

      - name: Build tools
        run: cmake --build build --config Release --target c2forge forge2c forge-rebuild 2>&1 | tail -5

      - name: Test
        run: |
          .\build\Release\forgevm.exe examples\simple.fge || echo "skip"
